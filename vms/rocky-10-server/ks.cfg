# Rocky Linux 10 unattended install (kickstart) for the VMware Workstation VM rocky-10-server
# Network: ens160 on "nat" (vmnet8) 10.10.8.12, ens192 on the isolated "lab" network (vmnet10) 10.10.10.12.
# The NIC names come from the PCI slots pinned in the .vmx (ethernet0 = 160, ethernet1 = 192).
# The user password hash and SSH key are injected at build time; neither is kept in the repo.

text
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc

network --device=ens160 --bootproto=static --ip=10.10.8.12 --netmask=255.255.255.0 --gateway=10.10.8.2 --nameserver=10.10.8.2 --onboot=yes --activate --hostname=rocky-10-server.lab.internal
network --device=ens192 --bootproto=static --ip=10.10.10.12 --netmask=255.255.255.0 --nodefroute --onboot=yes --activate

url --url=https://dl.rockylinux.org/pub/rocky/10/BaseOS/x86_64/os/
repo --name=AppStream --baseurl=https://dl.rockylinux.org/pub/rocky/10/AppStream/x86_64/os/

# Whole NVMe disk, LVM
zerombr
clearpart --all --initlabel --drives=nvme0n1
autopart --type=lvm
bootloader

# Accounts: root locked, admin user in wheel with SSH key login only
rootpw --lock
user --name=johan --gecos="Johan Socarras" --groups=wheel --iscrypted --password=@@USER_PASSWORD_HASH@@
sshkey --username=johan "@@SSH_PUBLIC_KEY@@"

# Security defaults the Red Hat family is known for
selinux --enforcing
firewall --enabled --service=ssh --remove-service=cockpit --remove-service=dhcpv6-client
services --enabled=sshd,vmtoolsd

firstboot --disable
skipx
poweroff

%packages
@^minimal-environment
open-vm-tools
%end

%post --log=/root/ks-post.log
printf 'PasswordAuthentication no\nKbdInteractiveAuthentication no\nPermitRootLogin no\n' > /etc/ssh/sshd_config.d/10-hardening.conf
chmod 600 /etc/ssh/sshd_config.d/10-hardening.conf
%end
