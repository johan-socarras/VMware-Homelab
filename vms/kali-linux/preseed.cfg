#### Kali Linux (rolling) unattended install for the VMware Workstation VM kali-linux
# Network: eth0 on "nat" (vmnet8) 10.10.8.14, eth1 on the isolated "lab" network (vmnet10) 10.10.10.14.
# Kali keeps the classic eth0/eth1 names (net.ifnames=0), which is what Kali users expect.
# Kali's own profile (/simple-cdd/kali.preseed and kali.postinst on the ISO) is still loaded on top of this file.
# The user password hash is injected at build time from a file kept out of the repo.

### Load Kali's simple-cdd profile, as the stock boot menu does
d-i preseed/early_command string anna-install simple-cdd-profiles

### Localization
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

### Network during the install (the installed system gets its profiles from finish.sh)
d-i netcfg/choose_interface select eth0
d-i netcfg/disable_autoconfig boolean true
d-i netcfg/get_ipaddress string 10.10.8.14
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 10.10.8.2
d-i netcfg/get_nameservers string 10.10.8.2
d-i netcfg/confirm_static boolean true
d-i netcfg/get_hostname string kali-linux
d-i netcfg/get_domain string lab.internal
d-i netcfg/hostname string kali-linux
d-i hw-detect/load_firmware boolean false
# Don't copy the installer's network setup to the system: finish.sh writes both NetworkManager profiles
d-i netcfg/target_network_config select loopback

### Mirror (Kali's redirector)
d-i mirror/country string manual
d-i mirror/http/hostname string http.kali.org
d-i mirror/http/directory string /kali
d-i mirror/http/proxy string

### Accounts: no root password, sudo is used instead
d-i passwd/root-login boolean false
d-i passwd/user-fullname string Johan Socarras
d-i passwd/username string johan
d-i passwd/user-password-crypted password @@USER_PASSWORD_HASH@@

### Clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### Partitioning: whole NVMe disk, LVM, everything in one filesystem
d-i partman-auto/disk string /dev/nvme0n1
d-i partman-auto/method string lvm
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### Packages: Xfce desktop + Kali's default tool set, SSH server, VMware tools
d-i apt-setup/cdrom/set-first boolean false
tasksel tasksel/first multiselect standard
d-i pkgsel/include string kali-desktop-xfce kali-linux-default openssh-server open-vm-tools-desktop
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

### Boot loader (UEFI)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default
d-i grub-installer/force-efi-extra-removable boolean false

### Post-install: lab NIC, SSH key login only (finish.sh), then power off so the host knows it finished
d-i preseed/late_command string \
  cp /cdrom/finish.sh /cdrom/authorized_keys /target/root/; \
  in-target sh /root/finish.sh; \
  rm -f /target/root/finish.sh /target/root/authorized_keys
d-i finish-install/reboot_in_progress note
d-i debian-installer/exit/poweroff boolean true
