# ESXi 8.0 U3e unattended install (kickstart) for the VMware Workstation VM esxi-8-host (nested ESXi)
# vmnic0 on "mgmt" (vmnet1): management, Host Client at https://10.10.1.15
# vmnic1 on "lab" (vmnet10): storage, vmk1 10.10.10.15 towards the TrueNAS NFS share 10.10.10.13
# The root password hash and the SSH public key are injected at build time; neither is kept in the repo.

vmaccepteula
install --firstdisk --overwritevmfs
rootpw --iscrypted @@ROOT_PASSWORD_HASH@@
keyboard 'US Default'
network --bootproto=static --device=vmnic0 --ip=10.10.1.15 --netmask=255.255.255.0 --gateway=10.10.1.1 --hostname=esxi-8-host.lab.internal
reboot

%firstboot --interpreter=busybox
# SSH: enabled, key login for root only.
# ESXi's sshd runs in FIPS 140 mode, which accepts ECDSA and RSA keys but not Ed25519.
# Passwords come in through keyboard-interactive (PAM), so that is the setting turned off.
mkdir -p /etc/ssh/keys-root
echo "@@SSH_PUBLIC_KEY@@" > /etc/ssh/keys-root/authorized_keys
chmod 600 /etc/ssh/keys-root/authorized_keys
esxcli system ssh server config set -k challengeresponseauthentication -v no
vim-cmd hostsvc/enable_ssh
vim-cmd hostsvc/start_ssh
esxcli system settings advanced set -o /UserVars/SuppressShellWarning -i 1

# Storage network: vSwitch1 on vmnic1 (lab), VMkernel port vmk1, no gateway.
# vmk1 reuses vmnic1's MAC: Workstation only delivers frames addressed to the virtual NIC's own MAC,
# so a VMkernel port with a generated MAC never gets ARP replies (vmk0 does the same with vmnic0).
esxcli network vswitch standard add -v vSwitch1
esxcli network vswitch standard uplink add -v vSwitch1 -u vmnic1
esxcli network vswitch standard portgroup add -v vSwitch1 -p Storage
VMNIC1_MAC=$(esxcfg-nics -l | awk '$1=="vmnic1"{print $7}')
esxcli network ip interface add -i vmk1 -p Storage -M "$VMNIC1_MAC"
esxcli network ip interface ipv4 set -i vmk1 -t static -I 10.10.10.15 -N 255.255.255.0
